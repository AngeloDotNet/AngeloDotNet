<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title">
  <title id="title">Angelo Pirola, .NET Software Engineer, Backend &amp; Cloud. Building reliable, maintainable software with C# and .NET since 2018, from the first .NET Core 2 releases to today's cloud-ready architectures.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#512bd4"/>
      <stop offset="0.55" stop-color="#2f4bd8"/>
      <stop offset="1" stop-color="#0e7ec4"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe4ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c4dff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7c4dff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <path id="hex" d="M0-40 34.6-20V20L0 40-34.6 20V-20Z"/>
    <clipPath id="frame">
      <rect width="1200" height="300" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- Background -->
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#dots)"/>
    <circle cx="970" cy="150" r="260" fill="url(#glow)"/>

    <path d="M0 232C220 180 400 290 640 245S1000 180 1200 225V300H0Z" fill="#fff" fill-opacity="0.08"/>
    <path d="M0 270C260 232 470 312 720 280S1040 248 1200 272V300H0Z" fill="#fff" fill-opacity="0.10"/>

    <!-- Hexagon motif -->
    <g fill="none" stroke="#ddd6fe" stroke-width="1.5">
      <use href="#hex" x="858" y="82" opacity="0.30"/>
      <use href="#hex" x="1082" y="82" opacity="0.40"/>
      <use href="#hex" x="858" y="218" opacity="0.40"/>
      <use href="#hex" x="1082" y="218" opacity="0.30"/>
      <use href="#hex" x="1156" y="150" opacity="0.18"/>
      <use href="#hex" x="784" y="150" opacity="0.14"/>
      <use href="#hex" x="1156" y="14" opacity="0.12"/>
      <use href="#hex" x="1156" y="286" opacity="0.12"/>
    </g>
    <g stroke="#ddd6fe" stroke-width="1.5" opacity="0.35">
      <path d="M892 102 920 118M1048 102 1020 118M892 198 920 182M1048 198 1020 182"/>
    </g>

    <!-- Central .NET hexagon -->
    <g transform="translate(970 150)">
      <use href="#hex" transform="scale(2)" fill="url(#accent)"/>
      <use href="#hex" transform="scale(2.25)" fill="none" stroke="#c4b5fd" stroke-width="0.7" opacity="0.5"/>
      <text y="13" text-anchor="middle" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#512bd4">.NET</text>
    </g>

    <!-- Text -->
    <g font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif">
      <text x="72" y="58" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="17" fill="#ddd6fe">namespace AngeloDotNet;</text>
      <text x="70" y="118" font-size="58" font-weight="700" fill="#ffffff">Angelo Pirola</text>
      <rect x="72" y="136" width="96" height="4" rx="2" fill="url(#accent)"/>
      <text x="72" y="174" font-size="25" fill="#eef0ff">.NET Software Engineer · Backend &amp; Cloud</text>
      <g font-size="16" fill="#e0e5ff">
        <text x="72" y="206">Building reliable, maintainable software with C# and .NET since 2018,</text>
        <text x="72" y="229">from the first .NET Core 2 releases to today's cloud-ready architectures.</text>
      </g>

      <!-- Tags -->
      <g font-size="14" font-weight="600" fill="#ede9fe" text-anchor="middle">
        <g fill="#ffffff" fill-opacity="0.06" stroke="#ddd6fe" stroke-opacity="0.45">
          <rect x="72" y="250" width="56" height="30" rx="15"/>
          <rect x="140" y="250" width="138" height="30" rx="15"/>
          <rect x="290" y="250" width="148" height="30" rx="15"/>
          <rect x="450" y="250" width="86" height="30" rx="15"/>
          <rect x="548" y="250" width="116" height="30" rx="15"/>
        </g>
        <text x="100" y="270">C#</text>
        <text x="209" y="270">ASP.NET Core</text>
        <text x="364" y="270">REST APIs</text>
        <text x="493" y="270">Docker</text>
        <text x="606" y="270">Claude Code</text>
      </g>
    </g>
  </g>
</svg>
